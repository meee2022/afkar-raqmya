<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#222;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;width:1208px}

.ic{width:240px;height:240px;border-radius:52px;background:#14050B;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px #0008}
.p{display:flex;gap:0}.p>div{padding:0 46px;text-align:center;border-inline-start:1px solid #8F6A2F55}.p>div:first-child{border:0}
.p b{display:block;font:700 30px Tajawal;color:#4A0E1E;margin-top:12px}.p span{font:400 12px Lexend;letter-spacing:.3em;color:#8F6A2F}

<div class="c" style="background:#14050B"><img src="athr-mark-gold.svg" height="300"><div><div class="w" style="color:#E7D2A4">ATHR</div><div class="t" style="color:#C9A35F">TECHNOLOGY &amp; DESIGN</div></div></div>

<div class="c row full" style="background:#4A0E1E"><img src="athr-mark-gold.svg" height="210"><div class="div" style="background:#C9A35F88"></div><div><div class="w" style="color:#F3E2B6;text-align:start">ATHR</div><div class="t" style="color:#C9A35F">INNOVATE TO MAKE AN IMPACT</div></div></div>
<div class="c" style="background:#2a0a14"><div class="ic"><img src="athr-mark-gold.svg" height="170"></div></div>

</div></div>
