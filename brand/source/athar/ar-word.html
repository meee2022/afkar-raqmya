<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&family=IBM+Plex+Sans+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#222;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;width:1208px}
  .c{position:relative;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,#5a1226 0%,#3a0a17 55%,#22060e 100%)}
  .n{position:absolute;top:12px;left:16px;color:#fff;font:400 20px Lexend;opacity:.8}
  .en{font:300 24px Lexend;letter-spacing:.55em;text-indent:.55em;color:#EBDDC6;margin-top:18px}
  .sub{font:500 16px 'IBM Plex Sans Arabic';color:#C9A35F;margin-top:10px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="60" y1="200" x2="300" y2="0"><stop offset="0" stop-color="#8F6A2F"/><stop offset=".55" stop-color="#E9D29D"/><stop offset="1" stop-color="#F6E9C8"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6E4F1F"/><stop offset="1" stop-color="#B98F4E"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8F6A2F"/><stop offset="1" stop-color="#F6E9C8"/></linearGradient>
  <g id="mark">
    <path d="M100 18 L28 182 L64 182 L100 96 Z" fill="url(#g1)"/>
    <path d="M100 18 L172 182 L136 182 L100 96 Z" fill="url(#g2)"/>
    <rect x="-13" y="-13" width="26" height="26" transform="translate(100 146) rotate(45)" fill="url(#g2)"/>
  </g>
  <!-- diamond helper -->
  <rect id="d" x="-8" y="-8" width="16" height="16" transform="rotate(45)"/>
</defs></svg>
<script>
const D = (x,y,s=1) => `<use href="#d" transform="translate(${x} ${y}) scale(${s})"/>`;

// V1: geometric, built from the A's angles. Alef = slanted blade, hamza = diamond,
// tha = tooth on a baseline + three diamond dots, ra = sharp descending blade.
const v1 = `
  <path d="M262 40 L282 22 L282 140 L262 140 Z"/>
  ${D(246,34,.85)}
  <path d="M160 122 H232 V96 L214 112 V122 H232 V140 H160 Z"/>
  ${D(182,88)}${D(208,88)}${D(195,66)}
  <path d="M170 122 L150 122 L92 194 L172 140 Z"/>`;

// V2: same skeleton, ra becomes a long sweeping underline (the "trace") ending in a pixel
const v2 = `
  <path d="M262 40 L282 22 L282 140 L262 140 Z"/>
  ${D(246,34,.85)}
  <path d="M160 122 H232 V96 L214 112 V122 H232 V140 H160 Z"/>
  ${D(182,88)}${D(208,88)}${D(195,66)}
  <path d="M170 122 L152 122 C 130 160, 90 176, 20 178 C 96 186, 150 170, 172 140 Z"/>
  ${D(8,178,.6)}`;

// V3: heavier, compact Kufi-like — square terminals, thick strokes
const v3 = `
  <path d="M256 30 L284 14 L284 140 L256 140 Z"/>
  ${D(238,26,.9)}
  <path d="M150 116 H236 V90 L212 106 V116 H236 V140 H150 Z"/>
  ${D(172,82,1.1)}${D(200,82,1.1)}${D(186,58,1.1)}
  <path d="M164 116 L140 116 L96 176 L120 176 L166 140 Z"/>`;

const W = (inner, w=300) => `<svg width="${w*1.25}" height="${200*1.25}" viewBox="0 0 300 200"><g fill="url(#gold)">${inner}</g></svg>`;
const cell = (n, inner, withMark) => `<div class="c"><b class="n">${n}</b>
  ${withMark ? `<div style="display:flex;align-items:center;gap:22px" dir="rtl">${W(inner)}<svg width="170" height="170" viewBox="0 0 200 200"><use href="#mark"/></svg></div>` : W(inner)}
  <div class="en">ATHR</div><div class="sub" dir="rtl">للتقنية والتصميم</div></div>`;
document.body.innerHTML += cell('1 · هندسي حاد', v1) + cell('2 · ذيل الأثر', v2) + cell('3 · كوفي ثقيل', v3) + cell('4 · مع الرمز', v1, true);
</script>
</body></html>
