<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&family=IBM+Plex+Sans+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#222;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;width:1208px}
  .c{position:relative;height:560px;display:flex;align-items:center;justify-content:center}
  .dark{background:radial-gradient(circle at 50% 38%,#5a1226 0%,#3a0a17 55%,#22060e 100%)}
  .full{grid-column:1/3;height:420px}
  .n{position:absolute;top:12px;left:16px;color:#fff;font:400 20px Lexend;opacity:.8}
  .col{display:flex;flex-direction:column;align-items:center}
  .ar{font-family:'IBM Plex Sans Arabic';font-weight:700;line-height:1}
  .arsub{font-family:'IBM Plex Sans Arabic';font-weight:500}
  .en{font-family:Lexend;font-weight:300;letter-spacing:.52em;text-indent:.52em}
  .tag{font-family:Lexend;font-weight:400;letter-spacing:.4em;text-indent:.4em;font-size:11px}
  .row{display:flex;align-items:center;gap:36px}
  .div{width:1px;height:150px;background:#C9A35F66}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8F6A2F"/><stop offset=".55" stop-color="#E9D29D"/><stop offset="1" stop-color="#F6E9C8"/></linearGradient>
  <linearGradient id="goldDark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6E4F1F"/><stop offset="1" stop-color="#B98F4E"/></linearGradient>
  <linearGradient id="mar" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4A0E1E"/><stop offset="1" stop-color="#7A1630"/></linearGradient>
  <linearGradient id="marDark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2E0812"/><stop offset="1" stop-color="#4A0E1E"/></linearGradient>
  <g id="mark">
    <path d="M100 18 L28 182 L64 182 L100 96 Z" fill="var(--a)"/>
    <path d="M100 18 L172 182 L136 182 L100 96 Z" fill="var(--b)"/>
    <rect x="-13" y="-13" width="26" height="26" transform="translate(100 146) rotate(45)" fill="var(--b)"/>
  </g>
</defs></svg>
<script>
const M = (s, dark=true) => `<svg width="${s}" height="${s}" viewBox="0 0 200 200" style="--a:url(#${dark?'goldDark':'marDark'});--b:url(#${dark?'gold':'mar'})"><use href="#mark"/></svg>`;
document.body.innerHTML += `
<div class="c dark"><b class="n">1 · عمودي</b><div class="col">
  ${M(180)}
  <div class="ar" style="font-size:64px;color:#F3E2B6;margin-top:22px" dir="rtl">أثـر</div>
  <div class="en" style="font-size:26px;color:#EBDDC6;margin-top:10px">ATHR</div>
  <div class="arsub" style="font-size:17px;color:#C9A35F;margin-top:14px" dir="rtl">للتقنية والتصميم</div>
</div></div>

<div class="c" style="background:#EBDDC6"><b class="n" style="color:#4A0E1E">2 · عمودي على البيج</b><div class="col">
  ${M(180,false)}
  <div class="ar" style="font-size:64px;color:#4A0E1E;margin-top:22px" dir="rtl">أثـر</div>
  <div class="en" style="font-size:26px;color:#4A0E1E;margin-top:10px">ATHR</div>
  <div class="arsub" style="font-size:17px;color:#8F6A2F;margin-top:14px" dir="rtl">للتقنية والتصميم</div>
</div></div>

<div class="c dark full"><b class="n">3 · أفقي ثنائي اللغة (هيدر الموقع، الفواتير، الختم)</b>
  <div class="row">
    <div class="col" style="align-items:flex-end" dir="rtl">
      <div class="ar" style="font-size:58px;color:#F3E2B6">أثر</div>
      <div class="arsub" style="font-size:18px;color:#C9A35F;margin-top:10px">للتقنية والتصميم</div>
    </div>
    <div class="div"></div>
    ${M(150)}
    <div class="div"></div>
    <div class="col" style="align-items:flex-start">
      <div class="en" style="font-size:44px;color:#EBDDC6;text-indent:0">ATHR</div>
      <div class="tag" style="color:#C9A35F;margin-top:12px;text-indent:0">TECH &amp; DESIGN</div>
    </div>
  </div>
</div>

<div class="c dark"><b class="n">4 · أفقي عربي</b>
  <div class="row" dir="rtl">
    ${M(130)}
    <div class="col" style="align-items:flex-start">
      <div class="ar" style="font-size:54px;color:#F3E2B6">أثر</div>
      <div class="arsub" style="font-size:17px;color:#C9A35F;margin-top:8px">للتقنية والتصميم</div>
      <div class="tag" style="color:#EBDDC699;margin-top:10px;text-indent:0;letter-spacing:.35em" dir="ltr">ATHR · TECH &amp; DESIGN</div>
    </div>
  </div>
</div>

<div class="c" style="background:#14050B"><b class="n">5 · صورة الحساب</b>
  <div style="width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#5a1226,#3a0a17);display:flex;align-items:center;justify-content:center">${M(190)}</div>
</div>`;
</script>
</body></html>
