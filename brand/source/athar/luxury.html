<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Playfair+Display:ital,wght@1,600&family=Bodoni+Moda:wght@600&family=Aref+Ruqaa:wght@700&family=Amiri:wght@700&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g1:#F3E2B6;--g2:#C9A35F;--g3:#8F6A2F}
body{margin:0;background:#120408;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:22px}
.c{background:radial-gradient(circle at 50% 30%,#5e1226,#2a0711 72%);border-radius:22px;height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gold{background:linear-gradient(160deg,var(--g1),var(--g2) 45%,var(--g3) 70%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.line{height:1px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.n{position:absolute;bottom:12px;font:700 14px Tajawal;color:#C9A35F}
.sp{width:16px;height:16px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3E2B6"/><stop offset=".5" stop-color="#C9A35F"/><stop offset="1" stop-color="#8F6A2F"/></linearGradient>
<path id="sp" d="M20 0C21.5 13 27 18.5 40 20C27 21.5 21.5 27 20 40C18.5 27 13 21.5 0 20C13 18.5 18.5 13 20 0Z"/></defs></svg>

<!-- 1 Cinzel serif caps -->
<div class="c"><svg class="sp" viewBox="0 0 40 40"><use href="#sp" fill="url(#gg)"/></svg>
<div class="gold" style="font:600 78px Cinzel;letter-spacing:.22em;margin:14px 0 0 .22em">ATHR</div>
<div class="line" style="width:220px;margin:14px 0"></div>
<div style="font:700 30px Amiri;color:#EBDDC6">أثر للتقنية والتصميم</div>
<div style="font:500 11px Cinzel;letter-spacing:.5em;color:#C9A35F;margin-top:8px">TECH · DESIGN</div>
<div class="n">١ — سيريف ملكي</div></div>

<!-- 2 Ruqaa calligraphy in ring -->
<div class="c"><div style="width:190px;height:190px;border-radius:50%;border:1.5px solid #C9A35F;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 7px #2a0711,inset 0 0 0 8px rgba(201,163,95,.5)">
<div class="gold" style="font:700 96px 'Aref Ruqaa';line-height:1;margin-top:-10px">أثر</div>
<svg viewBox="0 0 40 40" style="position:absolute;width:18px;top:30px;left:46px"><use href="#sp" fill="url(#gg)"/></svg></div>
<div style="font:500 12px Cinzel;letter-spacing:.45em;color:#C9A35F;margin-top:18px">ATHR · TECH &amp; DESIGN</div>
<div class="n">٢ — خط رقعة في ختم</div></div>

<!-- 3 Bodoni monogram A in double frame -->
<div class="c"><div style="width:150px;height:170px;border:1.5px solid #C9A35F;outline:1px solid rgba(201,163,95,.45);outline-offset:6px;display:flex;align-items:center;justify-content:center;position:relative">
<div class="gold" style="font:600 130px 'Bodoni Moda';line-height:1">A</div>
<svg viewBox="0 0 40 40" style="position:absolute;width:20px;top:16px;left:50%;transform:translateX(-50%)"><use href="#sp" fill="url(#gg)"/></svg></div>
<div class="gold" style="font:600 30px Cinzel;letter-spacing:.3em;margin-top:22px;padding-left:.3em">ATHR</div>
<div class="n">٣ — مونوجرام كلاسيكي</div></div>

<!-- 4 Reem Kufi geometric arabic -->
<div class="c"><div class="gold" style="font:700 128px 'Reem Kufi';line-height:1">أثر</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:10px"><div class="line" style="width:60px"></div><div style="font:500 22px 'Cormorant Garamond';font-style:italic;color:#EBDDC6;letter-spacing:.08em">Athr Tech &amp; Design</div><div class="line" style="width:60px"></div></div>
<div class="n">٤ — كوفي هندسي ذهبي</div></div>

<!-- 5 Playfair italic gold -->
<div class="c"><div style="position:relative"><div class="gold" style="font:600 italic 104px 'Playfair Display';letter-spacing:-.01em;line-height:1">athr</div>
<svg viewBox="0 0 40 40" style="position:absolute;width:26px;right:-30px;top:-6px"><use href="#sp" fill="url(#gg)"/></svg></div>
<div style="font:500 13px Cinzel;letter-spacing:.5em;color:#C9A35F;margin-top:18px">TECH &amp; DESIGN</div>
<div style="font:700 22px Amiri;color:#EBDDC6;margin-top:6px">من الفكرة إلى الأثر</div>
<div class="n">٥ — إيطالي فاخر</div></div>

<!-- 6 Islamic arch badge -->
<div class="c"><svg width="170" height="210" viewBox="0 0 170 210"><path d="M10 205 V95 Q10 18 85 6 Q160 18 160 95 V205 Z" fill="none" stroke="url(#gg)" stroke-width="2"/><path d="M20 198 V97 Q20 28 85 17 Q150 28 150 97 V198 Z" fill="none" stroke="#C9A35F" stroke-opacity=".45" stroke-width="1"/>
<use href="#sp" fill="url(#gg)" transform="translate(76 40) scale(.45)"/>
<text x="85" y="140" text-anchor="middle" font-family="Amiri" font-weight="700" font-size="64" fill="url(#gg)">أثر</text>
<text x="85" y="180" text-anchor="middle" font-family="Cinzel" font-size="13" letter-spacing="5" fill="#C9A35F">ATHR</text></svg>
<div class="n">٦ — قوس إسلامي</div></div>
</body></html>
