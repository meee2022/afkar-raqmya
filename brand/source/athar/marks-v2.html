<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#222;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;width:1208px}
  .c{position:relative;height:600px;background:radial-gradient(circle at 50% 38%,#5a1226 0%,#3a0a17 55%,#22060e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .n{position:absolute;top:12px;left:16px;color:#fff;font:400 22px Lexend}
  .w{font:300 50px Lexend;letter-spacing:.52em;text-indent:.52em;color:#EBDDC6;margin-top:30px}
  .t{font:400 12px Lexend;letter-spacing:.4em;text-indent:.4em;color:#C9A35F;margin-top:10px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6A2F"/><stop offset=".55" stop-color="#E9D29D"/><stop offset="1" stop-color="#F6E9C8"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6E4F1F"/><stop offset="1" stop-color="#B98F4E"/>
    </linearGradient>
  </defs>
</svg>

<!-- 1 Cursor Trace: a pointer that leaves a trail of pixels = the digital "athr" (trace) -->
<div class="c"><b class="n">1 — Cursor Trace</b>
  <svg width="230" height="230" viewBox="0 0 200 200">
    <g transform="translate(150 22)">
      <path d="M0 0 L0 104 L-27 79 L-44 116 L-59 109 L-42 73 L-78 73 Z" fill="url(#gold)"/>
      <rect x="-9" y="-9" width="18" height="18" transform="translate(-82 140) rotate(45)" fill="url(#gold)"/>
      <rect x="-6.5" y="-6.5" width="13" height="13" transform="translate(-106 163) rotate(45)" fill="url(#gold)" opacity=".8"/>
      <rect x="-4.5" y="-4.5" width="9" height="9" transform="translate(-126 181) rotate(45)" fill="url(#gold)" opacity=".55"/>
    </g>
  </svg>
  <div class="w">ATHR</div><div class="t">TECH &amp; DIGITAL SOLUTIONS</div>
</div>

<!-- 2 Faceted A: two gem facets, crossbar replaced by a pixel diamond -->
<div class="c"><b class="n">2 — Faceted A</b>
  <svg width="230" height="230" viewBox="0 0 200 200">
    <path d="M100 18 L28 182 L64 182 L100 96 Z" fill="url(#goldDark)"/>
    <path d="M100 18 L172 182 L136 182 L100 96 Z" fill="url(#gold)"/>
    <rect x="-13" y="-13" width="26" height="26" transform="translate(100 146) rotate(45)" fill="url(#gold)"/>
  </svg>
  <div class="w">ATHR</div><div class="t">TECH &amp; DIGITAL SOLUTIONS</div>
</div>

<!-- 3 Caret A: the code caret ^ as an A + rising pixel spark -->
<div class="c"><b class="n">3 — Caret</b>
  <svg width="230" height="230" viewBox="0 0 200 200">
    <path d="M34 172 L100 40 L166 172" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <rect x="-12" y="-12" width="24" height="24" transform="translate(100 132) rotate(45)" fill="url(#gold)"/>
    <rect x="-7" y="-7" width="14" height="14" transform="translate(152 44) rotate(45)" fill="url(#gold)"/>
    <rect x="-4.5" y="-4.5" width="9" height="9" transform="translate(174 22) rotate(45)" fill="url(#gold)" opacity=".7"/>
  </svg>
  <div class="w">ATHR</div><div class="t">TECH &amp; DIGITAL SOLUTIONS</div>
</div>

<!-- 4 Solid to Digital: the A's left leg is solid, right leg dissolves into pixels -->
<div class="c"><b class="n">4 — Solid → Digital</b>
  <svg width="230" height="230" viewBox="0 0 200 200">
    <path d="M100 16 L30 184 L64 184 L108 78 Z" fill="url(#gold)"/>
    <g fill="url(#gold)">
      <rect x="104" y="40" width="20" height="20"/>
      <rect x="114" y="64" width="20" height="20"/>
      <rect x="124" y="88" width="18" height="18"/>
      <rect x="134" y="112" width="16" height="16" opacity=".9"/>
      <rect x="143" y="134" width="13" height="13" opacity=".75"/>
      <rect x="151" y="154" width="10" height="10" opacity=".6"/>
      <rect x="158" y="171" width="7" height="7" opacity=".45"/>
      <rect x="70" y="128" width="16" height="16"/>
      <rect x="92" y="128" width="12" height="12" opacity=".75"/>
    </g>
  </svg>
  <div class="w">ATHR</div><div class="t">TECH &amp; DIGITAL SOLUTIONS</div>
</div>
</body></html>
