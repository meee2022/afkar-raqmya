<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Aref+Ruqaa:wght@700&family=Blaka&family=Gulzar&family=Lexend:wght@600&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120408;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:22px}
.c{background:radial-gradient(circle at 50% 30%,#5e1226,#2a0711 72%);border-radius:22px;height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gold{background:linear-gradient(160deg,#F3E2B6,#C9A35F 45%,#8F6A2F 70%,#F3E2B6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:500 14px Cinzel;letter-spacing:.5em;color:#C9A35F;margin-top:18px;padding-left:.5em}
.n{position:absolute;bottom:12px;font:700 15px Tajawal;color:#C9A35F}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="260"><stop offset="0" stop-color="#F3E2B6"/><stop offset=".5" stop-color="#C9A35F"/><stop offset="1" stop-color="#8F6A2F"/></linearGradient>
<path id="sp" d="M20 0C21.5 13 27 18.5 40 20C27 21.5 21.5 27 20 40C18.5 27 13 21.5 0 20C13 18.5 18.5 13 20 0Z"/></defs></svg>

<!-- A geometric monoline أثر with sparkle hamza -->
<div class="c"><svg width="260" height="230" viewBox="0 0 220 200"><g fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
<path d="M178 52 V150"/>
<path d="M130 112 V150 H62"/>
<path d="M62 150 Q62 182 30 186"/></g>
<g fill="url(#gg)"><rect x="112" y="68" width="14" height="14" rx="3" transform="rotate(45 119 75)"/><rect x="138" y="68" width="14" height="14" rx="3" transform="rotate(45 145 75)"/><rect x="125" y="46" width="14" height="14" rx="3" transform="rotate(45 132 53)"/></g>
<use href="#sp" fill="url(#gg)" transform="translate(162 4) scale(.8)"/></svg>
<div class="sub">ATHR · TECH &amp; DESIGN</div><div class="n">أ — حروف هندسية + همزة نجمة (تقني)</div></div>

<!-- B flowing Ruqaa big gold -->
<div class="c"><div style="position:relative"><div class="gold" style="font:700 170px 'Aref Ruqaa';line-height:1.1">اثر</div>
<svg viewBox="0 0 40 40" style="position:absolute;width:30px;right:22px;top:0px"><use href="#sp" fill="url(#gg)"/></svg></div>
<div class="sub">ATHR</div><div class="n">ب — خط عربي انسيابي (فخم)</div></div>

<!-- C tall alif beam + orbit -->
<div class="c"><svg width="300" height="310" viewBox="0 0 300 310">
<circle cx="150" cy="195" r="92" fill="none" stroke="url(#gg)" stroke-width="2.5"/>
<line x1="205" y1="62" x2="205" y2="250" stroke="#D9BC7E" stroke-width="13" stroke-linecap="round"/>
<use href="#sp" fill="#E9D3A0" transform="translate(189 14) scale(.8)"/>
<text x="140" y="236" text-anchor="middle" font-family="Aref Ruqaa" font-weight="700" font-size="104" fill="#D9BC7E">ثر</text></svg>
<div class="sub" style="margin-top:0">ATHR · TECH &amp; DESIGN</div><div class="n">ج — ألف ممدودة ومدار (مميز)</div></div>

<!-- D Blaka geometric decorative -->
<div class="c"><div style="position:relative"><div class="gold" style="font:400 170px Blaka;line-height:1.1">أثر</div>
<svg viewBox="0 0 40 40" style="position:absolute;width:26px;right:18px;top:10px"><use href="#sp" fill="url(#gg)"/></svg></div>
<div class="sub">ATHR · TECH &amp; DESIGN</div><div class="n">د — كوفي زخرفي حديث</div></div>
</body></html>
