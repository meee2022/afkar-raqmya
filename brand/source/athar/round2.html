<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;600;700;800&family=Tajawal:wght@800;900&family=Readex+Pro:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a060c;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:22px}
.c{background:radial-gradient(circle at 50% 35%,#8d2442,#4A0E1E 75%);border-radius:24px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.n{position:absolute;bottom:12px;font:800 15px Tajawal;color:#C9A97A}
.t{font:600 13px Lexend;letter-spacing:6px;color:#C9A97A;margin-top:14px}
.b{color:#EBDDC6}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><path id="sp" d="M20 0C21.5 13 27 18.5 40 20C27 21.5 21.5 27 20 40C18.5 27 13 21.5 0 20C13 18.5 18.5 13 20 0Z"/></defs></svg>

<!-- 1 ripple: impact rings -->
<div class="c"><svg width="150" height="150" viewBox="0 0 150 150"><g fill="none" stroke="#EBDDC6"><circle cx="75" cy="75" r="18" stroke-width="7"/><circle cx="75" cy="75" r="38" stroke-width="5" opacity=".7"/><circle cx="75" cy="75" r="58" stroke-width="3" opacity=".4"/></g><use href="#sp" fill="#EBDDC6" transform="translate(64 64) scale(.55)"/></svg>
<div class="b" style="font:700 46px Lexend;letter-spacing:-.02em;margin-top:6px">athr</div><div class="n">١ — موجات الأثر</div></div>

<!-- 2 arabic hamza as sparkle -->
<div class="c"><div style="position:relative;font:900 130px Tajawal;color:#EBDDC6;line-height:1">اثر<svg viewBox="0 0 40 40" style="position:absolute;width:34px;right:6px;top:-6px"><use href="#sp" fill="#EBDDC6"/></svg></div>
<div class="t">ATHR · TECH &amp; DESIGN</div><div class="n">٢ — همزة الألف = نجمة</div></div>

<!-- 3 monogram a with sparkle in counter -->
<div class="c"><div style="width:130px;height:130px;border-radius:34px;background:#EBDDC6;display:flex;align-items:center;justify-content:center;position:relative"><span style="font:800 120px Lexend;color:#7A1630;line-height:1;margin-top:-14px">a</span><svg viewBox="0 0 40 40" style="position:absolute;width:24px;right:16px;top:14px"><use href="#sp" fill="#7A1630"/></svg></div>
<div class="b" style="font:700 40px Lexend;margin-top:16px;letter-spacing:-.02em">athr</div><div class="n">٣ — مونوجرام a</div></div>

<!-- 4 trail: sparkle leaving a trail -->
<div class="c"><div style="display:flex;align-items:center;gap:14px"><div class="b" style="font:700 96px Lexend;letter-spacing:-.03em;line-height:1">athr</div>
<svg width="90" height="40" viewBox="0 0 90 40"><circle cx="6" cy="20" r="3" fill="#EBDDC6" opacity=".3"/><circle cx="22" cy="20" r="4" fill="#EBDDC6" opacity=".5"/><circle cx="40" cy="20" r="5" fill="#EBDDC6" opacity=".75"/><use href="#sp" fill="#EBDDC6" transform="translate(52 2) scale(.9)"/></svg></div>
<div class="t">TECH &amp; DESIGN</div><div class="n">٤ — أثر الحركة</div></div>

<!-- 5 bilingual lockup -->
<div class="c"><div style="display:flex;align-items:center;gap:22px"><div class="b" style="font:900 92px Tajawal;line-height:1">أثر</div><div style="width:2px;height:90px;background:#C9A97A"></div><div><div class="b" style="font:700 54px Lexend;letter-spacing:-.02em;line-height:1">athr</div><div style="font:600 11px Lexend;letter-spacing:5px;color:#C9A97A;margin-top:8px">TECH &amp; DESIGN</div></div></div>
<svg viewBox="0 0 40 40" style="position:absolute;width:30px;right:60px;top:80px"><use href="#sp" fill="#EBDDC6"/></svg><div class="n">٥ — عربي + إنجليزي</div></div>

<!-- 6 fingerprint arcs -->
<div class="c"><svg width="140" height="140" viewBox="0 0 140 140"><g fill="none" stroke="#EBDDC6" stroke-linecap="round"><path d="M40 110 A42 42 0 1 1 112 82" stroke-width="7"/><path d="M54 102 A28 28 0 1 1 98 78" stroke-width="6" opacity=".8"/><path d="M68 92 A14 14 0 1 1 84 74" stroke-width="5" opacity=".6"/></g><use href="#sp" fill="#EBDDC6" transform="translate(104 64) scale(.6)"/></svg>
<div class="b" style="font:700 44px Lexend;margin-top:4px;letter-spacing:-.02em">athr</div><div class="n">٦ — بصمة</div></div>
</body></html>
