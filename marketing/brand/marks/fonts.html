<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Manrope:wght@800&family=Plus+Jakarta+Sans:wght@800&family=Lexend:wght@700&family=Urbanist:wght@800&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Poppins:wght@700&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1d070e;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
.c{background:#7A1630;border-radius:20px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.w{font-size:96px;color:#EBDDC6;line-height:1;font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0}
.w span{display:inline-block}
.i{position:relative;margin-left:.04em}
.w svg{position:absolute;left:50%;top:-.02em;transform:translateX(-50%);width:.34em}
.s{font:600 13px Sora;letter-spacing:6px;color:#C9A97A;margin-top:14px}
.n{position:absolute;top:10px;right:14px;font:700 13px Sora;color:#C9A97A}
</style></head><body>
<script>
const fonts=[["Outfit",700,"1"],["Manrope",800,"2"],["Plus Jakarta Sans",800,"3"],["Lexend",700,"4"],["Urbanist",800,"5"],["Space Grotesk",700,"6"],["Syne",800,"7"],["Poppins",700,"8"],["Sora",700,"9 (Sora مظبوط)"]];
const star='<svg viewBox="0 0 40 40"><path d="M20 0C21.5 13 27 18.5 40 20C27 21.5 21.5 27 20 40C18.5 27 13 21.5 0 20C13 18.5 18.5 13 20 0Z" fill="#EBDDC6"/></svg>';
for(const [f,w,n] of fonts){document.write(`<div class="c"><div class="n">${n}</div><div class="w" style="font-family:'${f}';font-weight:${w};letter-spacing:-.02em"><span>f</span><span class="i">ı${star}</span><span>kra</span></div><div class="s">TECH &amp; DESIGN</div></div>`)}
</script></body></html>
